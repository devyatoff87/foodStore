<div class="flex">
  @for(item of emptyCounterArray(); track $index) {

  <app-rating-star
    [width]="48"
    [height]="20"
    [fillPercentsOne]="100"
    [fillPercentsTwo]="100"
    [fillColor]="'black'"
  ></app-rating-star>
  } @if(fillPercentsTwo()) {
  <app-rating-star
    [width]="48"
    [height]="20"
    [fillPercentsOne]="fillPercentsOne()"
    [fillPercentsTwo]="fillPercentsTwo()"
    [fillColor]="'black'"
  ></app-rating-star>
  }
</div>
